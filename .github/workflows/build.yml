name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Build Debug APK
        run: |
          cd ${{ github.workspace }}
          gradle assembleDebug --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SIPUTZX v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## 📱 SIPUTZX API App
            
            Build otomatis dari commit `${{ github.sha }}`
            
            ### ✨ 14 Kategori · 200+ Endpoint
            AI · Anime · Berita · Canvas · Downloader · Games · Info · Maker · Primbon · Random · Search · Stalker · Sticker · Tools
            
            ### 📥 Download
            Klik `app-debug.apk` di bawah untuk download langsung.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
